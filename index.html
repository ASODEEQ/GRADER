<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRADESHEET</title>
    <script src="https://kit.fontawesome.com/628bb20399.js" crossorigin="anonymous"></script>
    <style>
        body{
            overflow-x: hidden;
        }
        section{
            width: 100%;
            border: 1px solid rgb(230, 0, 255);
            height: 690px;
            padding-left: 300px;
            padding-right: 300px;
           background-color: aqua;
        }
        #screen{
            border: 5px solid rgb(60, 0, 255);
            width: 900px;
            height: 200px;
            /* padding-left: 30px; */
            background-color: beige; 
        }
        form{
            border: 5px solid rgb(208, 255, 0);
            width: 900px;
            height: 200px;
            background-color: black;
            /* padding-left: 50px; */
        }
        button{
            width: 500px;
            height: 50px;
            border-radius: 20px;
            color: white;
            background-color: black;
            font-size: x-large;
            border: 4px solid rgb(244, 28, 28);
            margin-left: 200px;
        }
        button:hover{
            zoom: 101%
        }
        input{
            border: 3px solid;
            width: 500px;
            height: 100px;
        }
        label{
            font-size: x-large;
            color: whitesmoke;
        }
        h1{
        font-size: 30px;
        color: red;
        margin-top: 150px;
        margin-left: 280px;
    }
        .fa-xmark{
            color: red;
            font-size: 100px;
        }
    .fa-a{
        color: rgb(9, 243, 71);
        font-size: 100px;
    }
    .fa-b{
        font-size: 100px;
        color: rgb(25, 28, 228);
    }
    .fa-c{
        font-size: 100px;
        color: rgb(187, 25, 228);
    }
    .fa-d{
        font-size: 100px;
        color: rgb(218, 228, 25);
    }
    .fa-e{
        font-size: 100px;
        color: rgb(228, 25, 25);
    }
    .fa-f{
        font-size: 100px;
        color: rgb(228, 25, 25);
    }
    .fa-thumbs-down{
        font-size: 100px;
        color: rgb(25, 184, 228);
    }

    @media screen and (max-width:850px){
        body{
            overflow-x: hidden;
        }
        section{
            border: 2px solid red;
            width: 100%;
            height: 800px;
            padding-left: 1px;
            padding-right: 1px;
        }
        #screen{
            width: 100%;
            padding-left: 1px;
        }
        form{
            width: 100%;
            padding-left: 1px;
        }   
        button{
            width: 100px;
            padding-left: 1px;
            margin-left: 0px;
            position: relative;
            left: 35%;
        }
        input{
            width: 50%;
        }
        h1{
            font-size: small;
            margin-left: 0px;
            text-align: center;
        }
    }
    </style>
</head>
<body>
    <section>
        <!-- <div class="flex"> -->
            <div id="screen"></div>
            <form action="">
                <label for="score">SCORE</label>
                <input type="number" id="yourscore" placeholder="input your score here">
            </form>
            <button onclick="check()">check</button>
          
            <h1>GRADE CHECKER</h1>
        <!-- </div> -->
    </section>
     <script>
        function check(){
           let displayscreen = document.getElementById('screen')
           let yourscore= document.getElementById ('yourscore').value
            if(yourscore< 0){
                 displayscreen.innerHTML = `<p> INVALID! <i class="fa-solid fa-xmark"></i> </p>`
                 displayscreen.style.fontSize= '50px'
            }
            else if (yourscore <=39){
                
                displayscreen.innerHTML= `<p> Your grade is <i class="fa-solid fa-f"></i> <i class="fa-solid fa-thumbs-down"></i></p>`
                displayscreen.style.fontSize= '50px'
            }
            else if(yourscore <= 40|| yourscore <= 44){
                 displayscreen.innerHTML= `<p> Your score is <i class="fa-solid fa-e"></i></p>`
                 displayscreen.style.fontSize= '50px'
            }
           else if(yourscore <=45|| yourscore<=49){
            displayscreen.innerHTML= `<p> Your score is <i class="fa-solid fa-d"></i></p>`
            displayscreen.style.fontSize= '50px'
           }
           else if(yourscore<=50 || yourscore <=59) {
             displayscreen.innerHTML= `<p> Your score is <i class="fa-solid fa-c"></i></p>`
             displayscreen.style.fontSize= '50px'
           }
           else if(yourscore <=60 || yourscore <=69){
            displayscreen.innerHTML = `<p> Your score is <i class="fa-solid fa-b"></i></p>`
            displayscreen.style.fontSize= '50px'
           }
           else if(yourscore <=70 || yourscore<=100){
             displayscreen.innerHTML = `<p> Your score is <i class="fa-solid fa-a"></i></p>`
             displayscreen.style.fontSize= '50px'
           }
           else{
             displayscreen.innerHTML = `<p> INVALID! <i class="fa-solid fa-xmark"></i></p>`
             displayscreen.style.fontSize= '50px'
           }
        }
       
     </script>
</body>
</html>
